name: basalt-image

# Press the button. It merges jesdga95/basalt main into the build tree, compiles
# for sm_120, and publishes ghcr.io/magikfly/basalt:latest. Nothing else.
#
# There is deliberately no gate and no skip. A press always builds. The old
# version skipped when it could prove an image for the upstream commit already
# existed - which also meant a Dockerfile fix shipped nothing at all, the exact
# silent-no-deploy failure mode already hit once on the mnemory workflow.
#
# The merge is never pushed back to GitHub. That is the whole reason this job can
# run with contents:read. Upstream edits .github/workflows/ci.yml, and GitHub
# refuses any push from an Actions token that writes a workflow file unless the
# `workflows` scope is granted; granting it would let an unreviewed upstream
# commit install a workflow that holds packages:write on this registry.
#
# Nothing is lost by not pushing. This fork owns exactly three files -
# Dockerfile, .dockerignore, .github/workflows/basalt-image.yml - and upstream
# ships none of them, so a published image is fully described by its
# `upstream-<sha>` tag plus those three files, both of which are durable.
#
# Moving :latest does not touch the running box. Watchtower runs with
# WATCHTOWER_DISABLE_CONTAINERS=strata,basalt. Pulling and recreating basalt is a
# separate, deliberate act.

on:
  workflow_dispatch: {}

permissions:
  contents: read     # the tree is read and merged locally, never written back
  packages: write    # publish to ghcr.io/magikfly/basalt

concurrency:
  group: basalt-image
  cancel-in-progress: false

env:
  UPSTREAM_REPO: jesdga95/basalt
  IMAGE: ghcr.io/magikfly/basalt
  CUDA_ARCH: "120"

jobs:
  image:
    name: Merge upstream, build, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the merge needs real history, not a shallow clone
          persist-credentials: false  # nothing in this job writes back to GitHub

      - name: Merge upstream main into the build tree
        id: upstream
        run: |
          git config user.name  "basalt-image[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # full fetch: objects shared with upstream are not re-downloaded, and a
          # shallow one would make the merge below impossible
          git fetch --no-tags upstream main
          SHA="$(git rev-parse FETCH_HEAD)"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "ahead=$(git rev-list --count HEAD..$SHA)" >> "$GITHUB_OUTPUT"

          if ! git merge --no-edit --no-ff "$SHA" \
               -m "Merge upstream $UPSTREAM_REPO main ($SHA)"; then
            echo "::error::Merge conflict with upstream; nothing was built or published. Fork-owned paths are Dockerfile, .dockerignore and .github/workflows/basalt-image.yml - if upstream has added one of those, reconcile it by hand."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "merged_tree=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:upstream-${{ steps.upstream.outputs.short }}
            ${{ env.IMAGE }}:upstream-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=nvidia/cuda:13.2.1-runtime-ubuntu24.04
            ai.basalt.upstream-commit=${{ steps.upstream.outputs.sha }}
            ai.basalt.cuda-arch=${{ env.CUDA_ARCH }}
          cache-from: type=gha,scope=basalt-image
          cache-to: type=gha,scope=basalt-image,mode=max

      - name: Report
        if: always()
        run: |
          {
            echo "## basalt image"
            echo ""
            echo "- upstream commit: \`${{ steps.upstream.outputs.short }}\` (${{ steps.upstream.outputs.ahead }} new to this fork)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- \`${IMAGE}:latest\` = \`upstream-${{ steps.upstream.outputs.short }}\`"
              echo "- rebuild recipe: upstream@\`${{ steps.upstream.outputs.sha }}\` + this fork's Dockerfile and .dockerignore"
              echo "- \`main\` is unchanged by design; the merge existed only in this runner."
            else
              echo "- **not published** - the tree is left untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
